  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serveruler</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script>
    function getIsCompanyDay() {
      const COMPANY_DAYS = [1,3,5];
      const weekDay = new Date().getDay();
      const isCompanyDay = COMPANY_DAYS.includes(weekDay);

      return isCompanyDay;
    }

    const COMPANY_IP_ADDRESS = "http://10.10.0.154:5173/";
    const HOME_IP_ADDRESS = "http://172.24.0.189:5173/";

    const isCarnavalNextToPanoramico = true
    const isCompanyDay = getIsCompanyDay();
    const ipAddress = isCarnavalNextToPanoramico ? HOME_IP_ADDRESS : isCompanyDay ? COMPANY_IP_ADDRESS : HOME_IP_ADDRESS;
    

    window.location.href = ipAddress;
    
    
  </script>
</head>
